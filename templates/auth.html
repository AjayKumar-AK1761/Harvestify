{% extends 'layout.html' %}

{% block body %}
<section class="banner_w3lspvt">
  <div class="banner-top">
    <div class="overlay">
      <div class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="card shadow-lg p-4 frozen-glass-card" style="max-width: 400px; width: 100%;">
          <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="AgriBot" style="width: 60px; border-radius: 8px;">
            <h2 class="mt-2 mb-0 text-light">Welcome to AgriBot</h2>
            <p class="lead text-light">Your smart agricultural assistant</p>
          </div>
          <div class="d-flex flex-column gap-2">
            <a href="{{ url_for('register') }}" class="btn btn-primary btn-block mb-2">Register</a>
            <a href="{{ url_for('login') }}" class="btn btn-outline-light btn-block">Login</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
{% endblock %}
