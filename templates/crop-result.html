{% extends 'layout.html' %}
{% block body %}
<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-lg p-4" style="max-width: 500px; width: 100%;">
    <div class="text-center mb-4">
      <img src="{{ url_for('static', filename='images/crop.png') }}" alt="Crop" style="width: 60px; border-radius: 8px;">
      <h2 class="mt-2 mb-0 text-success">Recommended Crop</h2>
    </div>
    <div class="text-center">
      <h4 class="mb-4">You should grow <span class="font-weight-bold text-primary">{{ prediction }}</span> in your farm.</h4>
      <a href="{{ url_for('crop_recommend') }}" class="btn btn-outline-primary mt-2">Try Another</a>
      <a href="{{ url_for('dashboard') }}" class="btn btn-link mt-2">Back to Dashboard</a>
    </div>
  </div>
</div>
{% endblock %}
