{% extends 'layout.html' %}
{% block body %}
<style>
  body.bg-disease {
    background-color: #e9eaf6;
  }
</style>
<script>
  function preview_image(event) {
    var reader = new FileReader();
    reader.onload = function () {
      var output = document.getElementById('output-image');
      output.src = reader.result;
    }
    reader.readAsDataURL(event.target.files[0]);
  }
</script>
<div class="container d-flex align-items-center justify-content-center min-vh-100 bg-disease">
  <div class="card shadow-lg p-4" style="max-width: 500px; width: 100%;">
    <div class="text-center mb-4">
      <img src="{{ url_for('static', filename='images/disease.png') }}" alt="AgriBot" style="width: 60px; border-radius: 8px;">
      <h2 class="mt-2 mb-0 text-success">Disease Prediction</h2>
      <p class="lead mb-1">Find out which disease has been caught by your plant</p>
      <small class="text-muted">Please upload a clear image of your crop leaf or plant.</small>
    </div>
    {% if error %}
      <div class="alert alert-danger" role="alert">{{ error }}</div>
    {% endif %}
    <form method="POST" enctype="multipart/form-data" action="{{ url_for('disease_prediction') }}">
      <div class="form-group">
        <label for="file">Upload Crop Image</label>
        <input type="file" class="form-control-file" id="file" name="file" accept="image/*" onchange="preview_image(event)" required />
      </div>
      <div class="text-center mb-3">
        <img id="output-image" class="rounded mx-auto d-block" style="max-width: 200px; display: none;" onload="this.style.display='block'" />
      </div>
      <button type="submit" class="btn btn-primary btn-block mt-3">Predict Disease</button>
    </form>
  </div>
</div>
<script>
  // Show preview if file is already selected (browser back)
  document.addEventListener('DOMContentLoaded', function() {
    var fileInput = document.getElementById('file');
    if (fileInput && fileInput.files && fileInput.files[0]) {
      preview_image({target: fileInput});
    }
  });
</script>
{% endblock %}
