<!DOCTYPE html>
<html lang="en">

<head>
    <title>{{ title }}</title>
    <link rel="shortcut icon" href="{{ url_for('static', filename='images/favicon.ico') }}" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style2.css') }}">

    <!-- for-mobile-apps -->
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta charset="utf-8">
    <meta name="keywords" content="Agro Harvest Responsive web template, Bootstrap Web Templates, Flat Web Templates, Android Compatible web template, 
Smartphone Compatible web template, free webdesigns for Nokia, Samsung, LG, SonyEricsson, Motorola web design" />
</head>

<body>
    <div class="container">
        <div class="form-card">
            <h2>Login</h2>
            {% if error %}
            <p class="error">{{ error }}</p>
            {% endif %}
            <form method="POST">
                {{ form.hidden_tag() }}

                <div class="form-group">
                    <label>{{ form.username.label }}</label>
                    {{ form.username(class="form-input") }}
                </div>

                <div class="form-group">
                    <label>{{ form.password.label }}</label>
                    {{ form.password(class="form-input") }}
                </div>

                <div class="form-group">
                    {{ form.submit(class="form-button") }}
                </div>
            </form>
            <p>Don't have an account? <a href="{{ url_for('register') }}">Register</a></p>
        </div>
    </div>
    {% if just_logged_out %}
    <script>
        // Prevent going back to protected pages after logout
        if (window.history && window.history.pushState) {
            window.history.pushState(null, null, window.location.href);
            window.onpopstate = function () {
                window.location.href = "/login"; // or just reload
            };
        }
    </script>
    {% endif %}

</body>

</html>
