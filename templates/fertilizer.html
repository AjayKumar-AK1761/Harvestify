{% extends 'layout.html' %}
{% block body %}
<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-lg p-4" style="max-width: 500px; width: 100%;">
    <div class="text-center mb-4">
      <img src="{{ url_for('static', filename='images/fertilizer.png') }}" alt="AgriBot" style="width: 60px; border-radius: 8px;">
      <h2 class="mt-2 mb-0">Fertilizer Recommendation</h2>
      <p class="lead">Get informed advice on fertilizer based on soil</p>
    </div>
    <form method="POST" action="{{ url_for('fert_recommend') }}">
      <div class="form-group">
        <label for="Nitrogen">Nitrogen</label>
        <input type="number" class="form-control" id="Nitrogen" name="nitrogen" placeholder="Enter the value (example:50)" required />
      </div>
      <div class="form-group">
        <label for="Phosphorous">Phosphorous</label>
        <input type="number" class="form-control" id="Phosphorous" name="phosphorous" placeholder="Enter the value (example:50)" required />
      </div>
      <div class="form-group">
        <label for="Pottasium">Pottasium</label>
        <input type="number" class="form-control" id="Pottasium" name="pottasium" placeholder="Enter the value (example:50)" required />
      </div>
      <div class="form-group">
        <label for="crop">Crop you want to grow</label>
        <select name="cropname" class="form-control" id="crop" required>
          <option selected>Select crop</option>
          <option>rice</option>
          <option>maize</option>
          <option>chickpea</option>
          <option>kidneybeans</option>
          <option>pigeonpeas</option>
          <option>mothbeans</option>
          <option>mungbean</option>
          <option>blackgram</option>
          <option>lentil</option>
          <option>pomegranate</option>
          <option>banana</option>
          <option>mango</option>
          <option>grapes</option>
          <option>watermelon</option>
          <option>muskmelon</option>
          <option>apple</option>
          <option>orange</option>
          <option>papaya</option>
          <option>coconut</option>
          <option>cotton</option>
          <option>jute</option>
          <option>coffee</option>
        </select>
      </div>
      <button type="submit" class="btn btn-primary btn-block mt-3">Predict</button>
    </form>
  </div>
</div>
{% endblock %}
